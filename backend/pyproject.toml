[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for LOPT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "decord>=0.6.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.115.12",
    "hf-xet>=1.1.10",
    "networkx==3.4.1",
    "pillow>=11.2.1",
    "pip>=25.2",
    "pydantic>=2.11.3",
    "safetensors>=0.5.3",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.51.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.6",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
